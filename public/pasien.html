<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HatiQu — Pasien</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8f1f6;--card:#fff;--ink:#1b2a35;--mute:#5d6f7c;--pri:#1d7fa8;--soft:#cfe8f3;--line:#d5e2ea;--ok:#2e8b57;--warn:#d89a00;--bad:#c9382f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a21;--card:#17252e;--ink:#e6eff4;--mute:#97aab7;--pri:#5bb8de;--soft:#21495c;--line:#29404d}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:15px;line-height:1.5}
.app{max-width:460px;margin:0 auto;min-height:100vh}
header{background:var(--pri);color:#fff;padding:14px 16px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header h1{margin:0;font-size:19px;font-weight:800}
header p{margin:2px 0 0;font-size:12.5px;opacity:.92}
.bar{display:flex;justify-content:space-between;min-height:26px}
.lk{background:none;border:0;color:#fff;font:inherit;font-weight:600;cursor:pointer;padding:0 0 4px}
main{padding:14px 14px 110px}
.sheet{background:var(--card);border-radius:18px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.sheet h2{font-size:17px;margin:2px 0 4px}
.sub{color:var(--mute);font-size:13px;margin:0 0 12px}
.tools{display:flex;gap:8px;margin-bottom:12px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
select{width:auto;max-width:44%}
label.f{display:block;margin-top:10px;font-weight:600;font-size:13px}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 4px}
.tile{background:none;border:0;font:inherit;color:var(--ink);cursor:pointer;text-align:center;padding:4px 2px;font-size:12px;line-height:1.25}
.ic{width:58px;height:58px;margin:0 auto 6px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:27px}
.tile:hover .ic{transform:scale(1.08)}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:20px 0}
.row{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.dot{flex:none;width:34px;height:34px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:16px}
.row b{display:block}.row small{color:var(--mute)}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;width:100%;margin-top:12px}
.btn.alt{background:var(--soft);color:var(--ink)}
.chip{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--soft);border:0;font-family:inherit}
.chip.ok{background:var(--ok);color:#fff}
.zone{border-radius:12px;padding:12px;margin-top:12px;color:#fff;font-weight:600}
.z-ok{background:var(--ok)}.z-warn{background:var(--warn);color:#1b1b1b}.z-bad{background:var(--bad)}
label.ck{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
label.ck input{width:20px;height:20px;flex:none}
.bub{padding:8px 12px;border-radius:14px;margin:6px 0;max-width:85%}
.me{background:var(--pri);color:#fff;margin-left:auto}.nu{background:var(--soft)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td,th{border-top:1px solid var(--line);padding:6px 3px;text-align:left;vertical-align:top}
.tabs{display:flex;gap:6px;margin-bottom:6px}.tabs button{flex:1;padding:9px;border:0;border-radius:10px;font:inherit;font-weight:600;background:var(--soft);color:var(--ink);cursor:pointer}.tabs .on{background:var(--pri);color:#fff}
.stars button{background:none;border:0;font-size:30px;cursor:pointer;color:var(--line)}.stars .on{color:#f0b400}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0;text-align:center}.cal small{color:var(--mute)}.day{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}.day i{position:absolute;bottom:4px;left:50%;margin-left:-4px;width:8px;height:8px;border-radius:50%}.day:disabled{opacity:.35;cursor:default}
.fine{font-size:12px;color:var(--mute);text-align:center;margin-top:14px}
.err{color:var(--bad);font-weight:600;margin-top:8px}

#bn{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;background:var(--card);border-top:1px solid var(--line);display:none;grid-template-columns:repeat(5,1fr);align-items:end;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:9;box-shadow:0 -2px 8px rgba(0,0,0,.08)}
#bn button{background:none;border:0;font:inherit;font-size:11px;font-weight:600;color:var(--mute);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0}
#bn button span{font-size:22px;line-height:1}
#bn .sg{margin-top:-32px;color:var(--bad);font-weight:800}
#bn .sg span{width:62px;height:62px;border-radius:50%;background:var(--bad);display:grid;place-items:center;font-size:27px;box-shadow:0 3px 10px rgba(0,0,0,.3);border:4px solid var(--card)}
</style>
</head>
<body>

</div>

var v=document.getElementById("view"),nav=document.getElementById("nav"),ttl=document.getElementById("ttl"),sub=document.getElementById("sub");

function digits(s){return String(s).replace(/\D/g,"")}

/* ===== Beranda ===== */
var M=[
["lab","🔬","Hasil Laboratorium","Hasil"],["rad","🩻","Hasil Radiologi","Hasil"],["pa","🧫","Hasil Patologi Anatomi","Hasil"],["alat","🫀","PENA","Hasil"],
["daftar","💻","Pendaftaran Online","Layanan"],["homecare","🏠","Home Care","Layanan"],["resume","📋","Resume Medis","Layanan"],["skdp","✉️","Dok. SKDP / Surat Kontrol","Layanan"],
["sket","📄","Surat Ket. Kesehatan","Layanan"],["bpjs","✅","Check IN BPJS","Layanan"],["temu","💬","TEMU","Layanan"],["layanan","🏨","Layanan Kami","Layanan"],["riwayat","🗓️","Riwayat Layanan","Layanan"],["profil","🪪","Info Pengguna","Layanan"],
["antrian","🧾","Antrian Rawat Jalan","Jadwal"],["radiot","☢️","Radioterapi","Jadwal"],["jdwrad","📡","Jadwal Radiologi & Tindakan Jantung","Jadwal"],["rehab","🏃","Jadwal Rehab Medik","Jadwal"],["dokter","👩‍⚕️","Jadwal Dokter","Jadwal"],["resep","💊","Status Resep","Jadwal"],
["gizi","🥗","Leaflet Gizi","Informasi"],["biaya","💳","Rincian Biaya Perawatan","Informasi"],["edu","📚","Media Edukasi Pasien","Informasi"],["well","🧘","Wellness","Informasi"],["survei","⭐","Survei Kepuasan Pelanggan","Informasi"],["aduan","📝","Layanan Pengaduan","Informasi"],["ruang","🛏️","Info Ruang Rawat","Informasi"],["iks","🤝","Ikatan Kerja Sama","Informasi"],["akses","🚌","Info Akses","Informasi"],
["gejala","📝","Catatan Gejala Harian","Pemantauan"],["tim","👥","Tim Perawatan","Pemantauan"],["alur","🧭","Alur Layanan","Pemantauan"]];
function home(q,cat){
  nav.innerHTML='<span></span><button class="lk" id="lo">Keluar</button>';
  document.getElementById("lo").onclick=function(){HQ.logout()};
  ttl.textContent="Halo, "+PT.nama;sub.textContent="No. RM "+PT.rm+(PT.dx?" · "+PT.dx.toLowerCase():"")+(PT.age?" · "+PT.age+" tahun":"");
  q=(q||"").toLowerCase();cat=cat||"Semua";
  var cats=["Semua","Hasil","Layanan","Jadwal","Informasi","Pemantauan"];
  var it=M.filter(function(m){return(cat=="Semua"||m[3]==cat)&&m[2].toLowerCase().indexOf(q)>-1});
  v.innerHTML='<div class="sheet"><h2 style="text-align:center">Semua Menu</h2><div class="tools"><input id="q" placeholder="Pencarian menu" aria-label="Pencarian menu" value="'+esc(q)+'"><select id="c" aria-label="Kategori">'+cats.map(function(c){return '<option'+(c==cat?' selected':'')+'>'+c+'</option>'}).join("")+'</select></div><div class="grid">'+
  (it.length?it.map(function(m){return '<button class="tile" data-id="'+m[0]+'"><div class="ic">'+m[1]+'</div>'+m[2]+'</button>'}).join(""):'<div class="empty">Menu tidak ditemukan. Coba kata lain.</div>')+'</div></div><p class="fine">Menu hasil lab, resep, resume, catatan gejala, dan TEMU memakai data asli akun Anda. Sebagian menu lain masih berisi informasi contoh.</p>';
  var qi=document.getElementById("q");
  qi.oninput=function(){home(qi.value,document.getElementById("c").value);var n=document.getElementById("q");n.focus();n.setSelectionRange(n.value.length,n.value.length)};
  document.getElementById("c").onchange=function(){home(qi.value,this.value)};
}
v.addEventListener("click",function(e){var t=e.target.closest(".tile");if(t&&st.user)open(t.dataset.id)});
function open(id){
  var m=M.filter(function(x){return x[0]==id})[0]||["sigap","🚑","SIGAP","Layanan"];
  nav.innerHTML='<button class="lk" id="bk">‹ Semua menu</button><button class="lk" id="lo">Keluar</button>';
  document.getElementById("bk").onclick=function(){home()};document.getElementById("lo").onclick=function(){HQ.logout()};
  ttl.textContent=m[2];sub.textContent=PT.nama+" · No. RM "+PT.rm;
  v.innerHTML='<div class="sheet" id="p"></div>';
  var p=document.getElementById("p");
  if(window.HQ_gated&&HQ_gated(id))HQ_gate(p,m[2]);else if(S[id])S[id](p);else generic(p,id,m[2]);
  window.scrollTo(0,0);
}

/* ===== Konten per menu: [subjudul, baris[], aksi[label,pesan], tabel] ===== */
var C={
lab:["Hasil pemeriksaan selama rawat inap terakhir (3 dan 8 Nov 2026).",0,0,[["Pemeriksaan","3 Nov","8 Nov","Rujukan"],["Hemoglobin","11,9","12,8","13–17 g/dL"],["Ureum","58","42","15–40 mg/dL"],["Kreatinin","1,5","1,3","0,7–1,3 mg/dL"],["Natrium","131","135","135–145 mmol/L"],["Kalium","4,6","4,2","3,5–5,0 mmol/L"],["NT-proBNP","5.800","3.150","kurang dari 125 pg/mL"],["Gula darah sewaktu","118","105","kurang dari 200 mg/dL"]]],
rad:["Foto toraks selama rawat inap terakhir.",[["🩻","3 Nov 2026","Kardiomegali (CTR sekitar 62%), edema paru, efusi pleura minimal kedua sisi"],["🩻","8 Nov 2026","Edema paru berkurang, kardiomegali menetap"]]],
pa:["Pemeriksaan patologi anatomi.",[["🧫","Belum ada pemeriksaan","Tn. Budi tidak memiliki pemeriksaan patologi anatomi. Hasil akan muncul di sini bila dilakukan."]]],
alat:["Pemeriksaan penunjang jantung.",[["🫀","Ekokardiografi, 4 Nov 2026","LVEF sekitar 32%, ventrikel kiri melebar, regurgitasi mitral ringan"],["📈","EKG, 3 Nov 2026","Sinus takikardi 104 kali per menit, hipertrofi ventrikel kiri"]]],
homecare:["Perawat penghubung dapat berkunjung bila Anda sulit ke puskesmas.",[["🏠","Kunjungan terjadwal","Belum ada. Ajukan kunjungan di bawah."],["🧰","Yang dilakukan","Timbang berat badan, tekanan darah, cek bengkak, tinjau obat dan catatan gejala"]],["Ajukan kunjungan rumah","Permintaan terkirim ke perawat puskesmas wilayah. Anda akan dihubungi untuk konfirmasi jadwal."]],
resume:["Ringkasan rawat inap ke-3 (2 sampai 9 Nov 2026).",[["🩺","Diagnosis","Gagal jantung kronis dengan perburukan, rawat inap ke-3 dalam 6 bulan"],["💧","Berat badan kering","Contoh: 69 kg, acuan pemantauan"],["⚠️","Tanda bahaya","Sesak bertambah, kaki bengkak, berat badan naik 2 kg atau lebih dalam 3 hari"],["🏥","Dikirim ke puskesmas","Terkirim 9 Nov 2026 beserta rencana tindak lanjut"]],["Unduh resume medis","Resume medis siap diunduh (contoh)."]],
skdp:["Surat kontrol rawat jalan.",[["✉️","Surat kontrol aktif","Poli jantung, 23 Nov 2026 pukul 09.00"],["📌","Bawa","Kartu BPJS, kartu berobat, catatan gejala harian"]],["Unduh surat kontrol","Surat kontrol siap diunduh (contoh)."]],
sket:["Pengajuan surat keterangan kesehatan.",[["📄","Surat keterangan sakit / sehat","Diajukan lewat poli, diproses sekitar 1 hari kerja"]],["Ajukan surat keterangan","Pengajuan terkirim. Ambil surat di poli jantung."]],
bpjs:["Check in kunjungan BPJS.",[["✅","Kunjungan berikutnya","Poli jantung, 23 Nov 2026"],["🪪","Status kepesertaan","Aktif (contoh)"]],["Check in sekarang","Check in tersedia mulai hari kunjungan."]],
layanan:["Layanan yang tersedia untuk gagal jantung.",[["🫀","Poli jantung dan ekokardiografi","Kontrol dokter spesialis"],["🛏️","Rawat inap","Perawatan perburukan"],["📞","Perawat penghubung","Telepon dan konsultasi pasca pulang"],["🏃","Rehabilitasi jantung","Latihan fisik terstruktur"]]],
riwayat:["Riwayat rawat inap dan pemeriksaan puskesmas.",[["🛏️","Rawat inap 1: 3–9 Mei 2026","Sesak dan penumpukan cairan"],["🛏️","Rawat inap 2: 18–24 Agu 2026","Perburukan gagal jantung"],["🛏️","Rawat inap 3: 2–9 Nov 2026","Perburukan gagal jantung, terapi diuretik"],["🏥","Puskesmas, 16 Nov 2026","Kunjungan hari ke-7: TD 128/78, nadi 80, berat 69,5 kg, edema minimal, obat dilanjutkan (contoh)"]]],
antrian:["Antrian rawat jalan hari ini.",[["🧾","Belum ada antrian aktif","Daftar atau check in pada hari kontrol (23 Nov 2026) untuk melihat nomor antrian."]]],
radiot:["Jadwal radioterapi.",[["☢️","Tidak ada jadwal","Radioterapi tidak termasuk rencana perawatan Tn. Budi."]]],
jdwrad:["Jadwal radiologi dan tindakan jantung.",[["📡","Belum ada jadwal baru","Foto toraks dan ekokardiografi ulang ditentukan dokter saat kontrol 23 Nov 2026."]]],
rehab:["Jadwal rehabilitasi medik.",[["🏃","Rehabilitasi jantung","Dapat diajukan dokter setelah kondisi stabil. Belum terjadwal."]]],
dokter:["Dokter yang merawat.",[["👨‍⚕️","dr. Sp.JP (contoh)","Poli jantung, Senin dan Kamis 08.00–12.00"],["🩹","Dokter puskesmas wilayah","Senin sampai Sabtu"]]],
resep:["Status resep obat pulang.",[["💊","Diuretik (pagi)","Sudah diambil 9 Nov, cukup sampai 7 Des"],["💊","Penyekat beta","Sudah diambil"],["💊","ACE inhibitor atau ARB","Sudah diambil"],["ℹ️","Catatan","Daftar dan dosis contoh. Ikuti resep dokter."]]],
gizi:["Panduan garam dan cairan.",[["🧂","Kurangi garam","Hindari asin, kerupuk, ikan asin, mi instan, makanan kaleng"],["🥤","Atur cairan","Ikuti batas cairan harian dari dokter, hitung semua minuman dan kuah"],["⚖️","Timbang tiap pagi","Catat di menu Catatan Gejala Harian"]]],
biaya:["Rincian biaya perawatan.",[["💳","Rawat inap 2–9 Nov 2026","Ditanggung BPJS Kesehatan (contoh)"],["🧾","Selisih biaya","Rp 0 (contoh)"]]],
edu:["Edukasi untuk pasien dan istri.",[["🟢","Zona hijau","Stabil. Lanjutkan obat dan catat gejala."],["🟡","Zona kuning","Berat badan naik 2 kg atau lebih dalam 3 hari, sesak atau bengkak bertambah. Hubungi perawat hari ini."],["🔴","Zona merah","Sesak saat istirahat, nyeri dada, pingsan. Ke IGD atau 119."]]],
well:["Program kebugaran.",[["🧘","Aktivitas ringan","Konsultasikan dulu dengan perawat atau dokter sebelum mengikuti program."]]],
aduan:["Layanan pengaduan.",[["📝","Sampaikan keluhan","Tulis lewat SIGAP atau loket pengaduan rumah sakit."]]],

iks:["Ikatan kerja sama.",[["🤝","BPJS Kesehatan","Pembiayaan layanan"],["🏥","Puskesmas wilayah","Rujuk balik dan pemantauan di komunitas"]]],
akses:["Akses menuju rumah sakit.",[["🚌","Transportasi","Informasi angkutan umum dan parkir (contoh). Bila sulit berkunjung, ajukan Home Care."]]],

alur:["Heart Failure Transitional Care Pathway.",[["1","Sebelum pulang","Edukasi teach-back, resume dikirim ke puskesmas"],["2","Hari ke-2 (11 Nov)","Telepon perawat penghubung: selesai"],["3","Hari ke-7 (16 Nov)","Kunjungan puskesmas: selesai"],["4","Hari ke-14 (23 Nov)","Kontrol poli jantung: terjadwal"],["5","Setiap hari","Catatan gejala: hijau lanjut, kuning hubungi perawat, merah ke IGD"]]]
};
function generic(p,id,name){
  var c=C[id];
  p.innerHTML='<h2>'+name+'</h2><p class="sub">'+c[1-1+0]+'</p>'+(c[1]?rows(c[1]):'')+(c[3]?'<table>'+c[3].map(function(r,i){var t=i?'td':'th';return '<tr>'+r.map(function(x){return '<'+t+'>'+x+'</'+t+'>'}).join("")+'</tr>'}).join("")+'</table>':'')+(c[2]?'<button class="btn" id="ac">'+c[2][0]+'</button><div id="am"></div>':'');
  var b=document.getElementById("ac");if(b)b.onclick=function(){document.getElementById("am").innerHTML='<p><span class="chip ok">Berhasil</span> '+c[2][1]+'</p>'}
}

/* ===== Menu khusus ===== */
var S={
daftar:function(p){
  p.innerHTML='<h2>Pendaftaran Online</h2><p class="sub">Daftar kontrol poli atau konsultasi.</p><label class="f">Poli<select id="pl" style="max-width:100%"><option>Poli Jantung</option><option>Puskesmas wilayah</option></select></label><label class="f">Tanggal<input type="date" id="dt"></label><button class="btn" id="dg">Daftar</button><div id="o"></div>';
  document.getElementById("dg").onclick=function(){var d=document.getElementById("dt").value;document.getElementById("o").innerHTML=d?'<p><span class="chip ok">Terdaftar</span> '+esc(document.getElementById("pl").value)+', '+esc(d)+'. Nomor antrian akan muncul di menu Antrian Rawat Jalan.</p>':'<p class="err">Pilih tanggal dulu.</p>'}},
gejala:function(p){
  p.innerHTML='<h2>Catatan Gejala Harian</h2><p class="sub">Isi tiap pagi setelah buang air kecil dan sebelum makan.</p><label class="f">Berat badan hari ini (kg)<input id="bb" type="number" step="0.1" value="70.0"></label><label class="f">Berat badan 3 hari lalu (kg)<input id="b0" type="number" step="0.1" value="69.0"></label>'+
  [["sesak","Sesak bertambah dari biasanya"],["bengkak","Kaki atau perut bengkak bertambah"],["batuk","Batuk malam atau sulit tidur datar"],["istirahat","Sesak saat istirahat"],["nyeri","Nyeri dada atau pingsan"]].map(function(g){return '<label class="ck"><input type="checkbox" id="g_'+g[0]+'">'+g[1]+'</label>'}).join("")+'<button class="btn" id="cek">Cek kondisi saya</button><div id="out"></div>';
  document.getElementById("cek").onclick=function(){
    var d=parseFloat(document.getElementById("bb").value)-parseFloat(document.getElementById("b0").value),g=function(k){return document.getElementById("g_"+k).checked},z,t,s;
    if(g("istirahat")||g("nyeri")){z="bad";t="Zona merah";s="Segera ke IGD atau hubungi 119."}
    else if(d>=2||g("sesak")||g("bengkak")||g("batuk")){z="warn";t="Zona kuning";s="Hubungi perawat hari ini lewat menu TEMU. Jangan mengubah obat sendiri."}
    else{z="ok";t="Zona hijau";s="Kondisi stabil. Lanjutkan obat, batasi garam dan cairan, catat lagi besok."}
    st.zone=t;document.getElementById("out").innerHTML='<div class="zone z-'+z+'">'+t+'<br><span style="font-weight:400">Perubahan berat badan: '+(isNaN(d)?"-":d.toFixed(1))+' kg dalam 3 hari. '+s+'</span></div>'+(z!="ok"?'<button class="btn alt" id="gt">Buka TEMU</button>':'');
